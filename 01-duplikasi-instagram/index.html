<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log into Instagram - Tugas 1</title>
<style>
  *{margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif;}
  body{background:#121212; color:#fff; display:flex; min-height:100vh;}
  .left{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; border-right:1px solid #262626; padding:30px; text-align:center;}
  .left h1{font-size:32px; line-height:1.3; max-width:450px;}
  .left h1 span{color:#e1306c;}
  .right{flex:1; display:flex; align-items:center; justify-content:center; padding:30px;}
  .login-box{width:100%; max-width:350px;}
  .login-box h2{margin-bottom:20px; font-size:22px;}
  input{width:100%; padding:12px; margin-bottom:10px; background:#1c1c1c; border:1px solid #363636; border-radius:8px; color:#fff; outline:none;}
  .btn-login{display:block; text-align:center; background:#0064e0; padding:11px; border-radius:20px; color:#fff; text-decoration:none; font-weight:bold; margin:5px 0 15px;}
  .link{color:#a8a8a8; font-size:13px; text-decoration:none; display:block; text-align:center; margin-bottom:15px;}
  .btn-fb{display:block; text-align:center; background:#262626; padding:11px; border-radius:20px; color:#fff; text-decoration:none; font-weight:bold; margin-bottom:15px;}
  .btn-create{display:block; text-align:center; border:1px solid #0095f6; padding:10px; border-radius:20px; color:#0095f6; text-decoration:none; font-weight:bold;}
  .meta{text-align:center; color:#8e8e8e; font-size:13px; margin-top:25px;}
  @media(max-width:768px){ body{flex-direction:column;} .left{display:none;} }
</style>
</head>
<body>

  <div class="left">
    <img src="https://static.cdninstagram.com/rsrc.php/yO/r/Ny6hrBVLYjl.webp" width="60">
    <h1>See everyday moments from your <span>close friends</span>.</h1>
    <img src="https://static.cdninstagram.com/rsrc.php/yJ/r/53X3pk-t2Gn.webp" width="300">
  </div>

  <div class="right">
    <div class="login-box">
      <h2>Log into Instagram</h2>
      <form>
        <input type="text" placeholder="Mobile number, username or email">
        <input type="password" placeholder="Password">
        <a href="#" class="btn-login">Log in</a>
        <a href="#" class="link">Forgot password?</a>
        <a href="#" class="btn-fb">👤 Log in with Facebook</a>
        <a href="#" class="btn-create">Create new account</a>
      </form>
      <p class="meta">∞ Meta</p>
    </div>
  </div>

</body>
      </html>
